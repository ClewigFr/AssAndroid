apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "fr.clewig.ass"
    compileSdk 35

    defaultConfig {
        applicationId "fr.clewig.ass"
        minSdk 16
        targetSdk 35
        versionCode 1
        versionName "1.0"

        // Demo configuration, overridable from the command line, e.g.
        // ./gradlew :app:installDebug -PassEndpoint=http://10.0.2.2:8099 -PassAppId=<uuid> -PassPages=<uuid>,<uuid>
        buildConfigField "String", "ASS_ENDPOINT", "\"${project.findProperty('assEndpoint') ?: 'http://10.0.2.2:8099'}\""
        buildConfigField "String", "ASS_APP_ID", "\"${project.findProperty('assAppId') ?: '00000000-0000-4000-8000-000000000000'}\""
        buildConfigField "String", "ASS_PAGES", "\"${project.findProperty('assPages') ?: ''}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation project(":assLib")
    implementation 'androidx.appcompat:appcompat:1.6.1' // last line supporting minSdk 16
}
