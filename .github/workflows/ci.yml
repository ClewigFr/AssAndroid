name: CI

on:
  push:
    branches: [master]
  pull_request:

# Pull requests from forks run with a read-only token
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # The Android SDK is preinstalled on GitHub's Ubuntu runners
      # publishToMavenLocal is what JitPack runs: a broken publication fails here first
      - run: ./gradlew :assLib:testDebugUnitTest :assLib:lintDebug :app:assembleDebug :assLib:publishToMavenLocal
      - name: Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            assLib/build/reports/
            app/build/reports/
