name: CI

on:
  push:
    branches: [master]
  pull_request:

# Pull requests from forks run with a read-only token
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      # The Android SDK is preinstalled on GitHub's Ubuntu runners
      # publishToMavenLocal is what JitPack runs: a broken publication fails here first
      - run: ./gradlew :assLib:testDebugUnitTest :assLib:lintDebug :app:assembleDebug :assLib:publishToMavenLocal
      - name: Reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports
          path: |
            assLib/build/reports/
            app/build/reports/
