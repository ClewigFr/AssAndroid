apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'maven-publish'

// JitPack builds the git tag and passes it as -Pversion; local builds use this one.
// The repository has two modules, so each has its own coordinates on JitPack:
// com.github.ClewigFr.AssAndroid:assLib:<tag> (the short com.github.ClewigFr:AssAndroid:<tag> would bring both)
group = 'com.github.ClewigFr.AssAndroid'
version = project.findProperty('version') != 'unspecified' ? project.findProperty('version') : '0.4.0'

android {
    namespace "fr.clewig.asslib"
    compileSdk 35

    defaultConfig {
        minSdk 16
        consumerProguardFiles "consumer-rules.pro"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

// Every public declaration of the library (not its tests) must say so: nothing becomes API by accident
kotlin {
    explicitApi()
}

dependencies {
    // No runtime dependency besides the Kotlin standard library: keep it that way

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303' // real org.json for JVM tests
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                artifactId = 'assLib'
                pom {
                    name = 'Anonymous Simple Stats'
                    description = 'Anonymous, batched screen-view tracker for Android'
                    url = 'https://github.com/ClewigFr/AssAndroid'
                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'https://opensource.org/licenses/MIT'
                        }
                    }
                }
            }
        }
    }
}
