apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace "fr.clewig.asslib"
    compileSdk 35

    defaultConfig {
        minSdk 16
            versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.lifecycle:lifecycle-process:2.6.2' // last line supporting minSdk 16
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0' // only Dispatchers.IO is used

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303' // real org.json for JVM tests
    androidTestImplementation 'androidx.test.ext:junit:1.1.3' // last version supporting minSdk 16
}
